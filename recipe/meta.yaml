{% set name = "python-cinderclient" %}
{% set version = "9.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: fb856e6f4382a4c84d82f00415e3c66514b73e12d94679935182ba4f86510916

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - cinder = cinderclient.shell:main

requirements:
  host:
    - pbr
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - pbr
    - prettytable >=0.7.2
    - keystoneauth1 >=5.0.0
    - oslo.i18n >=5.0.1
    - oslo.utils >=4.8.0
    - python >={{ python_min }}
    - requests >=2.25.1
    - stevedore >=3.3.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - cinderclient

about:
  home: https://docs.openstack.org/python-cinderclient/latest/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: OpenStack Block Storage API Client Library
  doc_url: https://docs.openstack.org/python-cinderclient/latest/
  dev_url: https://opendev.org/openstack/python-cinderclient

extra:
  recipe-maintainers:
    - tschoonj
